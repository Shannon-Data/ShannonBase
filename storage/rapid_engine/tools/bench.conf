# =============================================================================
# ShannonBase Rapid Engine — Benchmark Configuration
# =============================================================================
# Copy this file to bench.local.conf and customize for your environment.
# bench.local.conf is git-ignored (safe for passwords / local paths).
#
# All variables can also be overridden via environment variables at runtime.
# Env vars take precedence over this file.
# =============================================================================

# ─── MySQL Connection ───────────────────────────────────────────────────────
MYSQL_CLIENT="${MYSQL_CLIENT:-mysql}"
MYSQL_HOST="${MYSQL_HOST:-127.0.0.1}"
MYSQL_PORT="${MYSQL_PORT:-3306}"
MYSQL_USER="${MYSQL_USER:-root}"
MYSQL_PASS="${MYSQL_PASS:-}"
MYSQL_SOCKET="${MYSQL_SOCKET:-}"

# ─── Test Database ──────────────────────────────────────────────────────────
# Created & dropped by the script — do NOT use an existing database name.
TEST_DB="${TEST_DB:-rapid_bench}"

# ─── Data Scale ─────────────────────────────────────────────────────────────
# For bench_pure_select.sh: total rows in main table.
# Supports K (×1,000), M (×1,000,000), G (×1,000,000,000) suffixes.
SCALE="${SCALE:-1M}"

# ─── Benchmark Timing ───────────────────────────────────────────────────────
# Seconds to run each query category (throughput tests) or total benchmark time.
DURATION="${DURATION:-30}"

# ─── Concurrency ────────────────────────────────────────────────────────────
# Not yet wired up; reserved for future mysqlslap / multi-client support.
THREADS="${THREADS:-1}"

# ─── INSERT Batch Size ──────────────────────────────────────────────────────
# Rows per INSERT batch during data population.  Larger = faster populate but
# more memory per batch.
BATCH_SIZE="${BATCH_SIZE:-10000}"

# ─── Perf / FlameGraph ──────────────────────────────────────────────────────
# Set to 1 to collect perf data during the benchmark.
PERF_RECORD="${PERF_RECORD:-0}"
PERF_EVENTS="${PERF_EVENTS:-cycles:u,instructions:u,branches:u,branch-misses:u,cache-misses:u,cache-references:u}"
PERF_FREQ="${PERF_FREQ:-997}"
# mysqld PID for perf record.  Auto-detected if empty.
MYSQLD_PID="${MYSQLD_PID:-}"

# ─── Output ─────────────────────────────────────────────────────────────────
# Auto-generated with timestamp if empty:
#   RESULT_DIR="results/bench_$(date +%Y%m%d_%H%M%S)"
RESULT_DIR="${RESULT_DIR:-}"

# ─── Cleanup ────────────────────────────────────────────────────────────────
# Set to 1 to keep the test database after the benchmark finishes.
KEEP_DATA="${KEEP_DATA:-0}"
